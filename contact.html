<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Levis Nganga</title>
  <meta name="description" content="Contact Levis Nganga, software engineer in Nairobi, Kenya.">
  <meta name="theme-color" content="#04121f">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,0..100&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact" data-scene="deep" data-tint="0.8" data-depth-from="4000" data-depth-to="6000">
  <canvas id="ocean" aria-hidden="true"></canvas>
  <div class="tint" aria-hidden="true"></div>
  <a class="skip" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <div class="wrap page-hero">
      <p class="mono-label">Get in touch</p>
      <h1>Contact me</h1>
      <p class="lede">Let's connect and talk about how we can build something together.</p>
    </div>
    <section class="section" style="padding-top:1.5rem">
      <div class="wrap contact-grid">
        <dl class="contact-list">
          <div><dt>Email</dt><dd style="margin:0"><a id="contactEmail" href="#">email</a></dd></div>
          <div><dt>GitHub</dt><dd style="margin:0"><a id="contactGithub" href="#" target="_blank" rel="noopener">github</a></dd></div>
          <div><dt>Based in</dt><dd style="margin:0"><span class="v" id="contactLocation">Nairobi, Kenya</span></dd></div>
        </dl>
        <form id="contactForm" class="form">
          <div class="field"><label for="name">Your name</label><input id="name" name="name" autocomplete="name" required></div>
          <div class="field"><label for="email">Your email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="message">Message</label><textarea id="message" name="message" required></textarea></div>
          <button class="btn btn-primary" type="submit">Send message</button>
          <p id="formNote" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/ocean.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
